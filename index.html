<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #ffffff;
      padding: 16px;
    }
    .add-box {
      background: #181b22;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .add-title {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #2a2f3a;
      background: #0f1115;
      color: #ffffff;
    }
    .name-input { flex: 1; min-width: 150px; }
    .url-input { flex: 2; min-width: 220px; }
    .search-input { flex: 1; min-width: 220px; background: #181b22; }
    button {
      cursor: pointer;
      background: #2563eb;
      border: none;
      font-weight: 600;
    }
    button:active { transform: scale(0.98); }

    /* Categories */
    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 16px 0;
    }
    .cat-btn {
      background: #181b22;
      border: 1px solid #2a2f3a;
      color: #cbd5e1;
      padding: 8px 14px;
      font-size: 14px;
    }
    .cat-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .cat-btn.fav-active {
      background: #e11d48;
      border-color: #e11d48;
      color: #ffffff;
    }

    /* TV Remote Focus Ring */
    button:focus, input:focus, select:focus, .channel:focus {
      outline: 3px solid #38bdf8;
      outline-offset: 2px;
    }

    /* Toast Message */
    #toast {
      display: none;
      background: #16a34a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Video & YouTube Player */
    #player-box {
      display: none;
      margin-bottom: 18px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2f3a;
    }
    #now-playing {
      padding: 10px 14px;
      background: #181b22;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .player-controls { display: flex; gap: 8px; }
    .small-btn {
      padding: 6px 12px;
      font-size: 13px;
      background: #334155;
    }
    .small-btn.cc-on { background: #16a34a; }
    video, iframe {
      width: 100%;
      height: 55vh;
      max-height: 520px;
      display: block;
      background: #000;
      border: none;
    }

    /* Channel Grid */
    .status {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }
    .channel {
      background: #181b22;
      border: 1px solid #2a2f3a;
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .channel-info { overflow: hidden; margin-right: 10px; }
    .channel-name {
      font-weight: 600;
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .channel-cat {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }
    .fav-btn {
      background: transparent;
      font-size: 22px;
      padding: 6px 10px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="toast"></div>

  <!-- Player -->
  <div id="player-box">
    <div id="now-playing">
      <span id="player-title">Playing</span>
      <div class="player-controls">
        <button id="cc-btn" class="small-btn" style="display:none;" onclick="toggleSubtitles()">CC: Off</button>
        <button class="small-btn" onclick="closePlayer()">Close</button>
      </div>
    </div>
    <video id="video" controls autoplay playsinline></video>
    <iframe id="yt-frame" style="display:none;" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>

  <!-- Add M3U / M3U8 / YouTube Link Box (Starts Empty) -->
  <div class="add-box">
    <div class="add-title">➕ Add .m3u Playlist, .m3u8 Stream, or YouTube Link</div>
    <div class="row">
      <input id="custom-name" class="name-input" type="text" placeholder="Name (optional, e.g. Spanish Lesson)" />
      <input id="custom-url" class="url-input" type="text" placeholder="Paste .m3u, .m3u8, or YouTube link here..." />
      <select id="custom-cat">
        <option value="Auto">Auto Category</option>
        <option value="Movies">🎬 Movies</option>
        <option value="Music">🎵 Music</option>
        <option value="Lifestyle">✈️ Lifestyle</option>
        <option value="Series">📺 Series</option>
        <option value="General">🌐 General</option>
      </select>
      <button onclick="addNewLink()">Add Link</button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="row">
    <input id="search" class="search-input" type="text" placeholder="🔍 Search channels or saved videos..." oninput="renderChannels()" />
  </div>

  <!-- Categories + Favorites -->
  <div class="categories">
    <button class="cat-btn active" data-cat="All" onclick="selectCategory('All')">All</button>
    <button id="fav-tab-btn" class="cat-btn" data-cat="Favorites" onclick="selectCategory('Favorites')">❤️ Favorites (0)</button>
    <button class="cat-btn" data-cat="Movies" onclick="selectCategory('Movies')">🎬 Movies</button>
    <button class="cat-btn" data-cat="Music" onclick="selectCategory('Music')">🎵 Music</button>
    <button class="cat-btn" data-cat="Lifestyle" onclick="selectCategory('Lifestyle')">✈️ Lifestyle</button>
    <button class="cat-btn" data-cat="Series" onclick="selectCategory('Series')">📺 Series</button>
    <button class="cat-btn" data-cat="General" onclick="selectCategory('General')">🌐 General</button>
  </div>

  <div id="status-text" class="status">Loading default channels...</div>
  <div id="channel-list" class="grid"></div>

  <script>
    const DEFAULT_M3U = "https://iptv-org.github.io/iptv/index.m3u";

    // Saved data on device
    let customItems = JSON.parse(localStorage.getItem("iptv_custom_items") || "[]");
    let customPlaylists = JSON.parse(localStorage.getItem("iptv_custom_playlists") || "[]");
    let favorites = JSON.parse(localStorage.getItem("iptv_favorites_v2") || "[]");

    let playlistChannels = [];
    let activeCategory = "All";
    let hls = null;
    let ccEnabled = false;

    function showToast(msg, isError = false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = isError ? "#dc2626" : "#16a34a";
      t.style.display = "block";
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    function detectCategory(rawGroup, name) {
      const text = `${rawGroup} ${name}`.toLowerCase();
      if (/\b(movie|movies|film|films|cinema|cine|bollywood|hollywood|tollywood|kollywood)\b/.test(text)) return "Movies";
      if (/\b(music|mtv|vh1|hits|song|songs|radio|concert|rock|pop|jazz|classic fm|melody)\b/.test(text)) return "Music";
      if (/\b(lifestyle|travel|food|cook|cooking|kitchen|culinary|fashion|home|garden|living|tlc|hgtv)\b/.test(text)) return "Lifestyle";
      if (/\b(series|drama|sitcom|show|shows|soap|entertainment|comedy|anime|cartoon|kids)\b/.test(text)) return "Series";
      return "General";
    }

    function getYouTubeEmbedUrl(url) {
      try {
        const parsed = new URL(url);
        const listId = parsed.searchParams.get("list");
        let videoId = "";

        if (parsed.hostname.includes("youtu.be")) {
          videoId = parsed.pathname.slice(1);
        } else if (parsed.hostname.includes("youtube.com")) {
          videoId = parsed.searchParams.get("v") || "";
          if (!videoId && parsed.pathname.startsWith("/shorts/")) {
            videoId = parsed.pathname.split("/")[2];
          }
        }

        if (listId && !videoId) {
          return `https://www.youtube.com/embed/videoseries?list=${listId}&autoplay=1&cc_load_policy=1&cc_lang_pref=en`;
        }
        if (videoId) {
          return `https://www.youtube.com/embed/${videoId}?autoplay=1&cc_load_policy=1&cc_lang_pref=en`;
        }
      } catch (e) {}
      return null;
    }

    // Parse an M3U playlist URL and return channel objects
    async function fetchM3uChannels(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Failed to fetch playlist");
      const text = await res.text();
      const lines = text.split("\n").map(l => l.trim());

      const parsed = [];
      let currentName = "Unknown Channel";
      let currentGroup = "";

      for (const line of lines) {
        if (line.startsWith("#EXTINF:")) {
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          currentGroup = groupMatch ? groupMatch[1] : "";
          currentName = line.split(",").pop().trim() || "Channel";
        } else if (line.startsWith("http://") || line.startsWith("https://")) {
          parsed.push({
            name: currentName,
            url: line,
            category: detectCategory(currentGroup, currentName)
          });
          currentName = "Unknown Channel";
          currentGroup = "";
        }
      }
      return parsed;
    }

    // Add a new M3U, M3U8, or YouTube link without deleting existing channels
    async function addNewLink() {
      const nameInput = document.getElementById("custom-name");
      const urlInput = document.getElementById("custom-url");
      const catSelect = document.getElementById("custom-cat");

      const url = urlInput.value.trim();
      const customName = nameInput.value.trim();
      const chosenCat = catSelect.value;

      if (!url) {
        showToast("Please paste a link first.", true);
        return;
      }

      const isYouTube = url.includes("youtube.com") || url.includes("youtu.be");
      const cleanPath = url.split("?")[0].toLowerCase();
      const isDirectStream = cleanPath.endsWith(".m3u8") || cleanPath.endsWith(".mp4");

      // Case 1: YouTube video/playlist OR direct .m3u8 stream
      if (isYouTube || isDirectStream) {
        const defaultLabel = isYouTube ? "YouTube Video" : "Live M3U8 Stream";
        const finalName = customName || defaultLabel;
        const finalCat = chosenCat === "Auto" ? detectCategory("", finalName) : chosenCat;

        const newItem = { name: finalName, url: url, category: finalCat };

        // Save in custom items (avoid duplicates)
        customItems = [newItem, ...customItems.filter(i => i.url !== url)];
        localStorage.setItem("iptv_custom_items", JSON.stringify(customItems));

        // Clear inputs
        nameInput.value = "";
        urlInput.value = "";

        showToast(`Added "${finalName}"!`);
        renderChannels();
        playStream(newItem);
        return;
      }

      // Case 2: Full .m3u playlist URL
      showToast("Loading M3U playlist...");
      try {
        const newChannels = await fetchM3uChannels(url);
        if (newChannels.length === 0) {
          showToast("No channels found in that M3U link.", true);
          return;
        }

        if (!customPlaylists.includes(url)) {
          customPlaylists.unshift(url);
          localStorage.setItem("iptv_custom_playlists", JSON.stringify(customPlaylists));
        }

        // Put newly added playlist channels at the top of the list
        playlistChannels = [...newChannels, ...playlistChannels];
        nameInput.value = "";
        urlInput.value = "";

        showToast(`Added ${newChannels.length} channels from playlist!`);
        renderChannels();
      } catch (err) {
        showToast("Could not load M3U link. Make sure it uses https://", true);
      }
    }

    function selectCategory(category) {
      activeCategory = category;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.classList.remove("active", "fav-active");
        if (btn.dataset.cat === category) {
          btn.classList.add(category === "Favorites" ? "fav-active" : "active");
        }
      });
      renderChannels();
    }

    function updateFavCounter() {
      document.getElementById("fav-tab-btn").textContent = `❤️ Favorites (${favorites.length})`;
    }

    function renderChannels() {
      updateFavCounter();
      const query = document.getElementById("search").value.toLowerCase().trim();
      const list = document.getElementById("channel-list");
      const status = document.getElementById("status-text");
      list.innerHTML = "";

      // Combine user's custom added links + playlist channels
      const combinedAll = [...customItems, ...playlistChannels];
      const sourceList = activeCategory === "Favorites" ? favorites : combinedAll;

      const filtered = sourceList.filter(ch => {
        const matchesSearch = !query || ch.name.toLowerCase().includes(query);
        const matchesCat =
          activeCategory === "All" ||
          activeCategory === "Favorites" ||
          ch.category === activeCategory;
        return matchesSearch && matchesCat;
      });

      const shown = filtered.slice(0, 250);
      status.textContent = `Showing ${shown.length} of ${filtered.length} items`;

      shown.forEach(ch => {
        const isFav = favorites.some(f => f.url === ch.url);
        const card = document.createElement("div");
        card.className = "channel";
        card.tabIndex = 0;

        card.addEventListener("click", () => playStream(ch));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter") playStream(ch);
        });

        const info = document.createElement("div");
        info.className = "channel-info";

        const nameDiv = document.createElement("div");
        nameDiv.className = "channel-name";
        nameDiv.textContent = ch.name;

        const catDiv = document.createElement("div");
        catDiv.className = "channel-cat";
        catDiv.textContent = ch.category;

        info.appendChild(nameDiv);
        info.appendChild(catDiv);

        const favBtn = document.createElement("button");
        favBtn.className = "fav-btn";
        favBtn.type = "button";
        favBtn.textContent = isFav ? "❤️" : "🤍";
        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFav(ch);
        });

        card.appendChild(info);
        card.appendChild(favBtn);
        list.appendChild(card);
      });
    }

    function toggleFav(channel) {
      const exists = favorites.some(f => f.url === channel.url);
      if (exists) {
        favorites = favorites.filter(f => f.url !== channel.url);
        showToast(`Removed "${channel.name}" from Favorites`);
      } else {
        favorites.push({ name: channel.name, url: channel.url, category: channel.category });
        showToast(`Saved "${channel.name}" to Favorites (${favorites.length} total)`);
      }
      localStorage.setItem("iptv_favorites_v2", JSON.stringify(favorites));
      renderChannels();
    }

    function playStream(channel) {
      const box = document.getElementById("player-box");
      const video = document.getElementById("video");
      const ytFrame = document.getElementById("yt-frame");
      const ccBtn = document.getElementById("cc-btn");

      document.getElementById("player-title").textContent = `Now Playing: ${channel.name}`;
      box.style.display = "block";
      ccBtn.style.display = "none";
      ccEnabled = false;
      ccBtn.textContent = "CC: Off";
      ccBtn.classList.remove("cc-on");

      if (hls) {
        hls.destroy();
        hls = null;
      }

      const ytEmbed = getYouTubeEmbedUrl(channel.url);
      if (ytEmbed) {
        video.pause();
        video.style.display = "none";
        ytFrame.style.display = "block";
        ytFrame.src = ytEmbed;
      } else {
        ytFrame.src = "";
        ytFrame.style.display = "none";
        video.style.display = "block";

        if (Hls.isSupported() && channel.url.toLowerCase().includes(".m3u8")) {
          hls = new Hls();
          hls.loadSource(channel.url);
          hls.attachMedia(video);

          hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, (_, data) => {
            if (data.subtitleTracks && data.subtitleTracks.length > 0) {
              ccBtn.style.display = "inline-block";
              hls.subtitleDisplay = true;
            }
          });
        } else {
          video.src = channel.url;
        }
        video.play().catch(() => {});
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleSubtitles() {
      if (!hls || !hls.subtitleTracks.length) return;
      const ccBtn = document.getElementById("cc-btn");
      ccEnabled = !ccEnabled;

      if (ccEnabled) {
        const enIndex = hls.subtitleTracks.findIndex(t =>
          (t.lang && t.lang.toLowerCase().startsWith("en")) ||
          (t.name && t.name.toLowerCase().includes("english"))
        );
        hls.subtitleTrack = enIndex !== -1 ? enIndex : 0;
        ccBtn.textContent = "CC: On";
        ccBtn.classList.add("cc-on");
      } else {
        hls.subtitleTrack = -1;
        ccBtn.textContent = "CC: Off";
        ccBtn.classList.remove("cc-on");
      }
    }

    function closePlayer() {
      const video = document.getElementById("video");
      const ytFrame = document.getElementById("yt-frame");
      video.pause();
      ytFrame.src = "";
      if (hls) {
        hls.destroy();
        hls = null;
      }
      document.getElementById("player-box").style.display = "none";
    }

    // Load user's saved playlists + default iptv-org playlist silently in the background
    async function initApp() {
      renderChannels(); // Show saved custom items & favorites immediately

      const allPlaylistUrls = [...customPlaylists, DEFAULT_M3U];
      for (const plUrl of allPlaylistUrls) {
        try {
          const channels = await fetchM3uChannels(plUrl);
          playlistChannels = [...playlistChannels, ...channels];
          renderChannels();
        } catch (e) {}
      }
    }

    initApp();
  </script>
</body>
</html>
